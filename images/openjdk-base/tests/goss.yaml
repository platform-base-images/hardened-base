command:
  java-version:
    exec: "java -version"
    exit-status: 0
    stderr:
      - "/openjdk version/"
  mvn-version:
    exec: "mvn --version"
    exit-status: 0
    stdout:
      - "/Apache Maven/"
  javac-version:
    # Catches the JDK-installed-but-JRE-set-as-default case: java/mvn --version
    # can look fine while the compiler is unreachable (see openjdk-21-default-jvm
    # vs openjdk-21-default-jdk).
    exec: "javac -version"
    exit-status: 0
    stdout:
      - "/javac/"

file:
  /usr/bin/java:
    exists: true
  /usr/bin/javac:
    exists: true
  /etc/ssl/certs/ca-certificates.crt:
    exists: true
    mode: "0644"

user:
  nonroot:
    exists: true
    uid: 65532
    gid: 65532
