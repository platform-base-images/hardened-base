schemaVersion: 2.0.0

metadataTest:
  user: "nonroot"
  labels:
    - key: "org.opencontainers.image.source"
      value: "https://github.com/platform-base-images/hardened-base"
    - key: "org.opencontainers.image.licenses"
      value: "Apache-2.0"

commandTests:
  - name: "java binary executes"
    command: "java"
    args: ["-version"]
    expectedError: ["openjdk version"]
  - name: "mvn binary executes"
    command: "mvn"
    args: ["--version"]
    expectedOutput: ["Apache Maven"]
  - name: "javac binary executes"
    # Catches the JDK-installed-but-JRE-set-as-default case: java/mvn --version
    # can look fine while the compiler is unreachable (see openjdk-21-default-jvm
    # vs openjdk-21-default-jdk).
    command: "javac"
    args: ["-version"]
    expectedOutput: ["javac"]
  - name: "runs as non-root uid 65532"
    command: "id"
    args: ["-u"]
    expectedOutput: ["65532"]

fileExistenceTests:
  - name: "java binary present"
    path: "/usr/bin/java"
    shouldExist: true
  - name: "javac binary present"
    path: "/usr/bin/javac"
    shouldExist: true
  - name: "ca-certificates present"
    path: "/etc/ssl/certs/ca-certificates.crt"
    shouldExist: true
