file:
  /usr/sbin/nginx:
    exists: true
  /etc/nginx/nginx.conf:
    exists: true
    contents:
      - "server_tokens off"
      - "X-Frame-Options"
      - "Strict-Transport-Security"
      - "listen 8080"
  /etc/nginx/mime.types:
    exists: true

# nginx starts with its default CMD so the process is running at test time
process:
  nginx:
    running: true